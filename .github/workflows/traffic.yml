name: Store traffic

# Trickles visitors through the live store, one at a time, spaced the way
# real arrivals are, for just under the six hours a job is allowed to live.
#
# The schedule is deliberately far more frequent than the job length. GitHub
# fires scheduled runs on a best effort basis and drops most of them on a
# free public repository: of 18 half-hourly firings owed overnight, one
# arrived, 26 minutes late. So rather than needing 48 firings a day to land,
# this needs 4. The concurrency group holds the extra firings as a single
# pending run, which starts the moment the running one exits. Every hour is
# another chance to refill that pending slot, and only a six hour drought
# leaves the store quiet.

on:
  schedule:
    # Off the hour: minutes 0 and 30 are the most contended in the queue.
    - cron: '17 * * * *'
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      daily:
        description: 'Target sessions per day'
        required: false
        default: '1200'

concurrency:
  # One run at a time, with one more waiting in the wings. A newly queued
  # run replaces whatever was pending; the one already sending is untouched.
  group: store-traffic
  cancel-in-progress: false

jobs:
  visit:
    runs-on: ubuntu-latest
    # Six hours is the hard ceiling GitHub puts on a job. Sending stops at
    # 350 minutes so the summary gets printed instead of the job being shot.
    timeout-minutes: 358

    env:
      # The curve follows this clock, so the shape matches what the GA4
      # property shows. The runner itself is on UTC.
      TZ: Asia/Jerusalem
      STORE_URL: https://lumen-store-orcin.vercel.app
      DAILY: ${{ github.event.inputs.daily || '1200' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: traffic-generator
        run: npm ci

      - name: Install Chromium
        working-directory: traffic-generator
        run: npx playwright install --with-deps chromium

      - name: Send traffic
        working-directory: traffic-generator
        run: node generate.js --batch 350 --daily "$DAILY" --url "$STORE_URL"
