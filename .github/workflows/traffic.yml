name: Store traffic

# Wakes up every 30 minutes and trickles visitors through the live store for
# the rest of its slice, one at a time, spaced the way real arrivals are.
# Each run hands over to the next, so the store never goes quiet.

on:
  schedule:
    # Deliberately off the hour. GitHub queues scheduled runs globally and
    # minutes 0 and 30 are the most contended, so they get delayed or dropped.
    - cron: '12,42 * * * *'
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      daily:
        description: 'Target sessions per day'
        required: false
        default: '1200'

concurrency:
  group: store-traffic        # never let two runs overlap
  cancel-in-progress: false

jobs:
  visit:
    runs-on: ubuntu-latest
    # Sending runs for 27 minutes; the rest is setup and headroom. The job
    # has to be gone before the next one is due, or concurrency queues it.
    timeout-minutes: 29

    env:
      # The curve follows this clock, so the shape matches what the GA4
      # property shows. The runner itself is on UTC.
      TZ: Asia/Jerusalem
      STORE_URL: https://lumen-store-orcin.vercel.app
      DAILY: ${{ github.event.inputs.daily || '1200' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: traffic-generator
        run: npm ci

      - name: Install Chromium
        working-directory: traffic-generator
        run: npx playwright install --with-deps chromium

      - name: Send traffic
        working-directory: traffic-generator
        run: node generate.js --batch 27 --daily "$DAILY" --url "$STORE_URL"
